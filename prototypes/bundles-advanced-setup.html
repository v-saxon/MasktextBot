    /* ══════════════════════════════════════════════════════
       CSS Reset & Base Styles
       ══════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--xui-font-body);
      font-size: 16px;
      line-height: 20px;
      font-weight: 400;
      color: var(--xui-content-primary);
      background-color: var(--xui-bg-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ══════════════════════════════════════════════════════
       Component Styles — injected per page
       ══════════════════════════════════════════════════════ */
    /* ── Page-level motion tokens (SKILL.md step 7) ── */
    :root {
      --page-duration-micro: 150ms;
      --page-duration-macro: 300ms;
      --page-duration-slow: 500ms;
      --page-easing: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* from components/button.md */
    .xui-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: fit-content;
      max-width: 100%;
      box-sizing: border-box;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: var(--xui-font-body);
      font-weight: 500;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      white-space: nowrap;
      outline: none;
    }
    .xui-btn:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: 2px; }
    .xui-btn:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }
    .xui-btn--full-width { width: 100%; }
    .xui-btn--spread { justify-content: space-between; }
    .xui-btn--md { height: 48px; padding: 0 20px; font-size: 16px; border-radius: 8px; }
    .xui-btn--sm { height: 40px; padding: 0 20px; font-size: 14px; border-radius: 4px; }
    .xui-btn--xs { height: 32px; padding: 0 20px; font-size: 12px; border-radius: 4px; }
    .xui-btn--primary.xui-btn--brand {
      background: var(--xui-ctrl-brand-primary-bg);
      border-color: var(--xui-ctrl-brand-primary-border);
      color: var(--xui-ctrl-brand-text-primary);
    }
    .xui-btn--primary.xui-btn--brand:hover {
      background: var(--xui-ctrl-brand-primary-bg-hover);
      border-color: var(--xui-ctrl-brand-primary-border-hover);
    }
    .xui-btn--primary.xui-btn--brand:active { background: var(--xui-ctrl-brand-primary-bg-press); }
    .xui-btn--secondary.xui-btn--brand {
      background: var(--xui-ctrl-brand-secondary-bg);
      border-color: var(--xui-ctrl-brand-secondary-border);
      color: var(--xui-ctrl-brand-text-secondary);
    }
    .xui-btn--secondary.xui-btn--brand:hover {
      background: var(--xui-ctrl-brand-secondary-bg-hover);
      border-color: var(--xui-ctrl-brand-secondary-border-hover);
    }
    .xui-btn--tertiary.xui-btn--brand {
      background: var(--xui-ctrl-brand-tertiary-bg);
      color: var(--xui-ctrl-brand-text-tertiary);
    }
    .xui-btn--tertiary.xui-btn--brand:hover { background: var(--xui-ctrl-brand-tertiary-bg-hover); }
    .xui-btn--primary.xui-btn--mono {
      background: var(--xui-ctrl-mono-primary-bg);
      color: var(--xui-ctrl-mono-text-primary);
    }
    .xui-btn--primary.xui-btn--mono:hover { background: var(--xui-ctrl-mono-primary-bg-hover); }
    /* page-level: disabled dark CTA reads as light grey in the reference screen */
    .xui-btn--primary.xui-btn--mono:disabled { opacity: 1; background: var(--xui-ctrl-mono-secondary-bg); color: var(--xui-ctrl-mono-text-disable); }
    .xui-btn--ghost.xui-btn--mono {
      background: var(--xui-ctrl-mono-ghost-bg);
      color: var(--xui-ctrl-mono-text-ghost);
      border-color: var(--xui-ctrl-mono-ghost-border);
    }
    .xui-btn--ghost.xui-btn--mono:hover {
      background: var(--xui-ctrl-mono-ghost-bg-hover);
      border-color: var(--xui-ctrl-mono-ghost-border-hover);
    }
    .xui-btn--secondary.xui-btn--mono {
      background: var(--xui-ctrl-mono-secondary-bg);
      border-color: var(--xui-ctrl-mono-secondary-border);
      color: var(--xui-ctrl-mono-text-secondary);
    }
    .xui-btn--secondary.xui-btn--mono:hover {
      background: var(--xui-ctrl-mono-secondary-bg-hover);
      border-color: var(--xui-ctrl-mono-secondary-border-hover);
    }
    .xui-btn--md .xui-btn__icon,
    .xui-btn--sm .xui-btn__icon { width: 28px; height: 28px; }
    .xui-btn--xs .xui-btn__icon { width: 24px; height: 24px; }

    /* from components/button.md — IconButton */
    .xui-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: inherit;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background-color 0.15s ease;
      outline: none;
    }
    .xui-icon-btn:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: 2px; }
    .xui-icon-btn.xui-btn--xs { width: 32px; height: 32px; border-radius: 4px; }
    .xui-icon-btn.xui-btn--tertiary.xui-btn--brand:hover { background: var(--xui-ctrl-brand-tertiary-bg-hover); }

    /* from components/link.md */
    .xui-link {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      text-decoration: none;
      color: var(--xui-ctrl-link-primary);
      cursor: pointer;
      outline: none;
    }
    .xui-link:hover { opacity: 0.8; }
    .xui-link:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: 2px; }
    .xui-link--sm { font-size: 12px; }
    .xui-link--md { font-size: 14px; }
    .xui-link--lg { font-size: 16px; }
    .xui-link--underline { text-decoration: underline; }

    /* from components/status.md */
    .xui-status { display: inline-flex; flex-direction: row; align-items: center; }
    .xui-status--sm { gap: 4px; }
    .xui-status--md { gap: 6px; }
    .xui-status__dot { display: block; border-radius: 50%; flex-shrink: 0; }
    .xui-status--sm .xui-status__dot { width: 4px; height: 4px; }
    .xui-status--md .xui-status__dot { width: 6px; height: 6px; }
    .xui-status__dot--default { background-color: var(--xui-content-tertiary); }
    .xui-status__dot--success { background-color: var(--xui-content-success-primary); }
    .xui-status__dot--warning { background-color: var(--xui-content-warning-primary); }
    .xui-status__dot--alert { background-color: var(--xui-content-alert-primary); }
    .xui-status__dot--neutral { background-color: var(--xui-content-neutral-primary); }
    .xui-status__label { color: var(--xui-content-primary); font-weight: 400; font-family: var(--xui-font-body); }
    .xui-status--sm .xui-status__label { font-size: 12px; line-height: 16px; }
    .xui-status--md .xui-status__label { font-size: 14px; line-height: 20px; }
    .xui-status__label--dot-color.xui-status__label--success { color: var(--xui-content-success-primary); }
    .xui-status__label--dot-color.xui-status__label--warning { color: var(--xui-content-warning-primary); }
    .xui-status__label--dot-color.xui-status__label--neutral { color: var(--xui-content-neutral-primary); }
    .xui-status__label--dot-color.xui-status__label--default { color: var(--xui-content-tertiary); }

    /* from components/tag.md */
    .xui-tag {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: fit-content;
      font-family: var(--xui-font-body);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: none;
      background: transparent;
    }
    .xui-tag--sm { height: 24px; padding: 0 8px; font-size: 14px; gap: 4px; border-radius: var(--xui-radius-tag-sm); }
    .xui-tag--xs { height: 20px; padding: 0 6px; font-size: 12px; gap: 4px; border-radius: var(--xui-radius-tag-sm); }
    .xui-tag__icon { display: block; flex-shrink: 0; }
    .xui-tag--sm .xui-tag__icon { width: 16px; height: 16px; }
    .xui-tag--xs .xui-tag__icon { width: 16px; height: 16px; }
    .xui-tag--primary { background: var(--xui-bg-primary); color: var(--xui-content-primary); }
    .xui-tag--secondary { background: var(--xui-bg-secondary); color: var(--xui-content-primary); }
    .xui-tag--brand { background: var(--xui-bg-brand-primary); color: var(--xui-content-on-brand); }
    .xui-tag--brand-extra { background: var(--xui-bg-brand-extra-primary); color: var(--xui-content-on-brand-extra); }
    .xui-tag--success { background: var(--xui-bg-success-primary); color: var(--xui-content-on-success); }

    /* from components/rich-icon.md */
    .xui-rich-icon { display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; flex-shrink: 0; }
    .xui-rich-icon--sm { width: 24px; height: 24px; }
    .xui-rich-icon--md { width: 32px; height: 32px; }
    .xui-rich-icon--lg { width: 40px; height: 40px; }
    .xui-rich-icon--xl { width: 64px; height: 64px; }
    .xui-rich-icon--rounded { border-radius: 8px; }
    .xui-rich-icon--circle { border-radius: 1000px; }
    .xui-rich-icon__icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--xui-ctrl-mono-secondary-bg);
    }
    .xui-rich-icon__text { color: var(--xui-content-primary); font-weight: 600; text-align: center; user-select: none; }
    .xui-rich-icon--sm .xui-rich-icon__text { font-size: 10px; }
    .xui-rich-icon--md .xui-rich-icon__text { font-size: 12px; }

    /* from components/progress-bar.md */
    .xui-progress-bar { display: flex; flex-direction: column; width: 100%; }
    .xui-progress-bar--lg { gap: 8px; }
    .xui-progress-bar--md { gap: 6px; }
    .xui-progress-bar--sm { gap: 4px; }
    .xui-progress-bar__header { display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .xui-progress-bar__label-group { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .xui-progress-bar__label { color: var(--xui-content-secondary); font-weight: 500; }
    .xui-progress-bar__status-icon { flex-shrink: 0; }
    .xui-progress-bar__track { width: 100%; border-radius: 100px; overflow: hidden; background-color: var(--xui-ctrl-input-bg); }
    .xui-progress-bar--lg .xui-progress-bar__track { height: 8px; }
    .xui-progress-bar--md .xui-progress-bar__track { height: 6px; }
    .xui-progress-bar--sm .xui-progress-bar__track { height: 4px; }
    .xui-progress-bar__fill { height: 100%; border-radius: 100px; }
    .xui-progress-bar--default .xui-progress-bar__fill { background-color: var(--xui-content-brand-primary); }
    .xui-progress-bar--success .xui-progress-bar__fill { background-color: var(--xui-content-success-primary); }
    .xui-progress-bar--default .xui-progress-bar__status-icon { color: var(--xui-content-brand-primary); }
    .xui-progress-bar--success .xui-progress-bar__status-icon { color: var(--xui-content-success-primary); }
    .xui-progress-bar__helper { color: var(--xui-content-secondary); }
    .xui-progress-bar--lg .xui-progress-bar__label { font-size: 14px; }
    .xui-progress-bar--lg .xui-progress-bar__helper { font-size: 12px; }
    .xui-progress-bar--md .xui-progress-bar__label,
    .xui-progress-bar--md .xui-progress-bar__helper,
    .xui-progress-bar--sm .xui-progress-bar__label { font-size: 12px; }

    /* from components/navigation.md — NavBar */
    .xui-nav-bar {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: var(--xui-bg-primary);
    }
    .xui-nav-bar--md { height: 64px; padding: 0 16px; }
    .xui-nav-bar--bordered { border-bottom: 1px solid var(--xui-border-secondary); }
    .xui-nav-bar__start { display: flex; flex-direction: row; align-items: center; justify-content: flex-start; flex: 1; flex-basis: 0; gap: 8px; }
    .xui-nav-bar__end { display: flex; flex-direction: row; align-items: center; justify-content: flex-end; flex: 1; flex-basis: 0; gap: 8px; }

    /* from components/navigation.md — Breadcrumbs */
    .xui-breadcrumbs { display: flex; flex-direction: row; align-items: center; flex-wrap: wrap; }
    .xui-breadcrumbs__list { display: flex; flex-direction: row; align-items: center; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; gap: 8px; }
    .xui-breadcrumbs__link { color: var(--xui-content-tertiary); font-size: 14px; font-weight: 400; text-decoration: none; cursor: pointer; }
    .xui-breadcrumbs__link:hover { opacity: 0.8; }
    .xui-breadcrumbs__link--active { color: var(--xui-content-primary); font-weight: 600; cursor: default; }
    .xui-breadcrumbs__sep { display: flex; align-items: center; color: var(--xui-content-tertiary); }

    /* from components/segmented.md */
    .xui-segmented {
      display: flex;
      flex-direction: row;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      width: fit-content;
      background-color: var(--xui-ctrl-segmented-bg);
      border: 1px solid var(--xui-border-secondary);
      overflow: hidden;
    }
    .xui-segmented__item {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      outline: none;
    }
    .xui-segmented__item:hover { background-color: var(--xui-ctrl-segmented-bg-hover); }
    .xui-segmented__item:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: -2px; }
    .xui-segmented__label { color: var(--xui-ctrl-segmented-text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Size sm, from the segmented.md size table (height 40, padding 4, radius 4, item 6/12, item radius 2, font 14).
       Active fill applied to the item instead of the JS-measured sliding indicator. */
    .xui-segmented--sm { height: 40px; padding: 4px; border-radius: 4px; gap: 2px; }
    .xui-segmented--sm .xui-segmented__item { height: 100%; padding: 6px 12px; border-radius: 2px; font-family: var(--xui-font-body); }
    .xui-segmented--sm .xui-segmented__label { font-size: 14px; }
    .xui-segmented__item--active { background-color: var(--xui-ctrl-segmented-bg-active); }

    /* from components/tabs.md — line variant */
    .xui-tabs--line { display: flex; flex-direction: row; align-items: flex-end; width: fit-content; border-bottom: 1px solid var(--xui-border-secondary); }
    .xui-tabs--line.xui-tabs--sm { height: 40px; }
    .xui-tab {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      height: inherit;
      padding: 0 20px;
      background: transparent;
      border: none;
      border-bottom: 0px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--xui-content-tertiary);
      font-weight: 500;
      font-family: var(--xui-font-body);
      outline: none;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .xui-tabs--sm .xui-tab { font-size: 14px; }
    .xui-tab:hover:not(.xui-tab--disabled):not(.xui-tab--active) { background-color: var(--xui-overlay-mono); }
    .xui-tab--active { color: var(--xui-content-primary); font-weight: 600; border-bottom: 2px solid var(--xui-border-primary); border-bottom-style: solid; }
    .xui-tab:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: -2px; }
    .xui-tab__counter { color: var(--xui-content-brand-primary); font-weight: 500; }

    /* from components/notification.md */
    .xui-notification {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
      border-radius: var(--xui-radius-card);
      padding: 16px;
    }
    .xui-notification--inline { align-items: center; }
    .xui-notification--neutral { background: var(--xui-bg-neutral-secondary); }
    .xui-notification--success { background: var(--xui-bg-success-secondary); }
    .xui-notification--warning { background: var(--xui-bg-warning-secondary); }
    .xui-notification--alert { background: var(--xui-bg-alert-secondary); }
    .xui-notification__icon-wrap { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .xui-notification--neutral .xui-notification__icon-wrap { color: var(--xui-content-neutral-primary); }
    .xui-notification--success .xui-notification__icon-wrap { color: var(--xui-content-success-primary); }
    .xui-notification--warning .xui-notification__icon-wrap { color: var(--xui-content-warning-primary); }
    .xui-notification--alert .xui-notification__icon-wrap { color: var(--xui-content-alert-primary); }
    .xui-notification__body { flex: 1; display: flex; }
    .xui-notification__body--column { flex-direction: column; gap: 8px; align-items: flex-start; }
    .xui-notification__body--row { flex-direction: row; gap: 28px; align-items: center; }
    .xui-notification__text-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .xui-notification__title { font-family: var(--xui-font-body); font-size: 16px; font-weight: 500; color: var(--xui-content-primary); margin: 0; }
    .xui-notification__message { font-family: var(--xui-font-body); font-size: 14px; font-weight: 400; color: var(--xui-content-secondary); margin: 0; }
    .xui-notification__action {
      font-family: var(--xui-font-body);
      font-size: 16px;
      font-weight: 500;
      color: var(--xui-content-primary);
      letter-spacing: 0.4px;
      white-space: nowrap;
      background: none;
      border: none;
      padding: 8px 0;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .xui-notification__action:hover { opacity: 0.75; }
    .xui-notification__action:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: 2px; border-radius: 2px; }
    .xui-notification--inline .xui-notification__action { padding: 0; }
    .xui-notification__close {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--xui-content-primary);
      margin-top: 2px;
      transition: opacity 0.15s ease;
    }
    .xui-notification--inline .xui-notification__close { margin-top: 0; }
    .xui-notification__close:hover { opacity: 0.7; }

    /* from components/radio.md */
    .xui-radio { display: flex; align-items: flex-start; cursor: pointer; }
    .xui-radio--md { gap: 8px; }
    .xui-radio__control {
      border-radius: 50%;
      border-style: solid;
      border-color: var(--xui-ctrl-faint-border);
      background: var(--xui-ctrl-faint-bg);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .xui-radio--md .xui-radio__control { width: 18px; height: 18px; border-width: 1px; }
    .xui-radio__control:hover { background: var(--xui-ctrl-faint-bg-hover); border-color: var(--xui-ctrl-faint-border-hover); }
    .xui-radio--checked .xui-radio__control { border-color: var(--xui-ctrl-check-border); background: var(--xui-ctrl-check-bg); }
    .xui-radio--checked .xui-radio__control:hover { background: var(--xui-ctrl-check-bg-hover); border-color: var(--xui-ctrl-check-border-hover); }
    .xui-radio__dot { border-radius: 50%; background: var(--xui-ctrl-check-icon); display: none; }
    .xui-radio--md .xui-radio__dot { width: 8px; height: 8px; }
    .xui-radio--checked .xui-radio__dot { display: block; }
    .xui-radio__text { display: flex; flex-direction: column; }
    .xui-radio--md .xui-radio__text { gap: 2px; }
    .xui-radio__label { font-family: var(--xui-font-body); color: var(--xui-content-primary); }
    .xui-radio--md .xui-radio__label { font-size: 16px; line-height: 18px; }
    .xui-radio__description { font-family: var(--xui-font-body); color: var(--xui-content-tertiary); }
    .xui-radio--md .xui-radio__description { font-size: 14px; line-height: 16px; }

    /* from components/checkbox.md */
    .xui-checkbox { display: flex; align-items: flex-start; cursor: pointer; }
    .xui-checkbox--md { gap: 8px; }
    .xui-checkbox__control {
      border: 2px solid var(--xui-ctrl-faint-border);
      background: var(--xui-ctrl-faint-bg);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .xui-checkbox--md .xui-checkbox__control { width: 18px; height: 18px; border-radius: 2px; }
    .xui-checkbox__control:hover { background: var(--xui-ctrl-faint-bg-hover); border-color: var(--xui-ctrl-faint-border-hover); }
    .xui-checkbox--checked .xui-checkbox__control { border-color: var(--xui-ctrl-check-border); background: var(--xui-ctrl-check-bg); }
    .xui-checkbox__icon { display: none; color: var(--xui-ctrl-check-icon); }
    .xui-checkbox--checked .xui-checkbox__icon { display: flex; }
    .xui-checkbox--md .xui-checkbox__icon { width: 14px; height: 14px; }
    .xui-checkbox__text { display: flex; flex-direction: column; }
    .xui-checkbox--md .xui-checkbox__text { gap: 2px; }
    .xui-checkbox__label { font-family: var(--xui-font-body); color: var(--xui-content-primary); }
    .xui-checkbox--md .xui-checkbox__label { font-size: 16px; line-height: 18px; }
    .xui-checkbox__description { font-family: var(--xui-font-body); color: var(--xui-content-tertiary); }
    .xui-checkbox--md .xui-checkbox__description { font-size: 14px; line-height: 16px; }

    /* from components/input.md */
    .xui-input-wrapper { display: flex; flex-direction: column; }
    .xui-input__container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--xui-ctrl-input-bg);
      border: 1px solid var(--xui-ctrl-input-border);
      transition: background-color 0.15s ease, border-color 0.15s ease, outline 0.15s ease;
    }
    .xui-input__container:hover { background: var(--xui-ctrl-input-bg-hover); border-color: var(--xui-ctrl-input-border-hover); }
    .xui-input__container:focus-within {
      background: var(--xui-ctrl-focus-bg);
      border-color: transparent;
      outline: 1px solid var(--xui-border-brand);
      outline-offset: -1px;
    }
    .xui-input--error .xui-input__container { border-color: transparent; outline: 1px solid var(--xui-border-alert); outline-offset: -1px; }
    .xui-input--disabled .xui-input__container { background: var(--xui-ctrl-input-bg-disable); border-color: var(--xui-ctrl-input-border-disable); cursor: not-allowed; }
    .xui-input--disabled .xui-input { color: var(--xui-ctrl-input-text-disable); cursor: not-allowed; }
    .xui-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--xui-ctrl-input-text);
      font-family: var(--xui-font-body);
      width: 100%;
    }
    .xui-input::placeholder { color: var(--xui-ctrl-input-placeholder); }
    .xui-input--md .xui-input__container { height: 48px; padding: 11px 12px; border-radius: 8px; }
    .xui-input--md .xui-input { font-size: 16px; }
    .xui-input--sm .xui-input__container { height: 40px; padding: 7px 10px; border-radius: 4px; }
    .xui-input--sm .xui-input { font-size: 14px; }
    .xui-input__icon-right { flex-shrink: 0; color: var(--xui-content-secondary); }
    .xui-input__error { color: var(--xui-content-alert-primary); font-size: 14px; line-height: 16px; margin-top: 4px; }
    /* page-level: dark native date picker inside xui-input */
    .xui-input[type="date"] { color-scheme: dark; }

    /* from components/field-group.md */
    .xui-field-group { display: flex; flex-direction: column; width: 100%; }
    .xui-field-group--md { gap: 4px; }
    .xui-field-group__label-row { display: flex; align-items: center; gap: 6px; }
    .xui-field-group__label { font-family: var(--xui-font-body); color: var(--xui-content-tertiary); }
    .xui-field-group--md .xui-field-group__label { font-size: 14px; line-height: 16px; }
    .xui-field-group__label--required::before { content: '*'; color: var(--xui-content-alert-primary); }
    .xui-field-group__description { font-family: var(--xui-font-body); color: var(--xui-content-tertiary); }
    .xui-field-group--md .xui-field-group__description { font-size: 14px; line-height: 16px; }
    .xui-field-group__helper { font-family: var(--xui-font-body); color: var(--xui-content-tertiary); }
    .xui-field-group--md .xui-field-group__helper { font-size: 14px; line-height: 16px; }
    .xui-field-group__error { font-family: var(--xui-font-body); color: var(--xui-content-alert-primary); }
    .xui-field-group--md .xui-field-group__error { font-size: 14px; line-height: 16px; }

    /* from components/divider.md */
    .xui-divider { display: flex; flex-direction: row; align-items: center; width: 100%; }
    .xui-divider--md { height: 16px; }
    .xui-divider__line { flex: 1; border: none; border-top: 1px solid var(--xui-border-secondary); margin: 0; }

    /* ══════════════════════════════════════════════════════
       Page layout — account shell (B2B dashboard context)
       ══════════════════════════════════════════════════════ */
    /* ══════════════════════════════════════════════════════
       Page layout — Business Account shell (Pentagram Light, B2B)
       Matches "Get started — Xsolla" reference screen
       ══════════════════════════════════════════════════════ */
    html, body { height: 100%; }
    body { background-color: var(--xui-bg-secondary); }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: var(--xui-space-m);
      height: 52px;
      padding: 0 var(--xui-space-s) 0 var(--xui-space-s);
      background: var(--xui-bg-primary);
      border-bottom: 1px solid var(--xui-border-secondary);
    }
    .topbar__logo { color: var(--xui-content-primary); display: flex; align-items: center; padding: 0 var(--xui-space-xs); }
    .topbar__account { display: flex; align-items: center; gap: var(--xui-space-s); font-size: 16px; font-weight: 500; padding-right: var(--xui-space-m); border-right: 1px solid var(--xui-border-secondary); height: 32px; }
    .topbar__acct-id { display: inline-flex; align-items: center; height: 22px; border-radius: var(--xui-radius-tag-sm); overflow: hidden; font-size: 13px; font-weight: 500; background: var(--xui-overlay-mono); }
    .topbar__acct-id b { background: var(--xui-bg-inverse); color: var(--xui-content-inverse); padding: 0 var(--xui-space-xs); height: 100%; display: inline-flex; align-items: center; font-weight: 500; }
    .topbar__acct-id span { padding: 0 var(--xui-space-xs); }
    .topbar__project { display: flex; align-items: center; gap: var(--xui-space-s); font-size: 16px; font-weight: 500; }
    .topbar__project .xui-rich-icon__icon { background: var(--xui-bg-alert-secondary); color: var(--xui-content-primary); }
    .topbar__chev { color: var(--xui-content-tertiary); display: flex; }
    .topbar__right { margin-left: auto; display: flex; align-items: center; gap: var(--xui-space-m); font-size: 15px; font-weight: 500; }
    .topbar__right > span { display: inline-flex; align-items: center; gap: var(--xui-space-xs); }
    .topbar__iconbtn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--xui-radius-button); color: var(--xui-content-primary); }
    .topbar__iconbtn--filled { background: var(--xui-bg-secondary); }

    .app { display: flex; min-height: calc(100vh - 52px); width: 100%; }

    /* Sidebar */
    .sidebar {
      width: 316px;
      flex-shrink: 0;
      background: var(--xui-bg-primary);
      border-right: 1px solid var(--xui-border-secondary);
      position: sticky;
      top: 52px;
      height: calc(100vh - 52px);
      overflow-y: auto;
      padding: var(--xui-space-s);
      display: flex;
      flex-direction: column;
      gap: var(--xui-space-xs);
    }
    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-nav__group-title { font-size: 14px; line-height: 18px; color: var(--xui-content-secondary); font-weight: 500; padding: var(--xui-space-m) var(--xui-space-s) var(--xui-space-xs); }
    .side-nav__sep { height: 1px; background: var(--xui-border-secondary); margin: var(--xui-space-s) 0; }
    .side-nav__item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 35px;
      padding: 0 var(--xui-space-s);
      border-radius: var(--xui-radius-button);
      color: var(--xui-content-primary);
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color var(--page-duration-micro) ease;
    }
    .side-nav__item > svg:first-child { width: 20px; height: 20px; flex-shrink: 0; }
    .side-nav__item:hover { background: var(--xui-overlay-mono); }
    .side-nav__item--active { background: var(--xui-bg-secondary); box-shadow: inset 0 0 0 1px var(--xui-border-secondary); }
    .side-nav__chev { margin-left: auto; color: var(--xui-content-tertiary); display: flex; }
    .side-nav__item--open .side-nav__chev { transform: rotate(90deg); }
    .side-nav__sub { display: flex; flex-direction: column; gap: 2px; padding-left: 30px; }
    .side-nav__sub .side-nav__item { font-size: 15px; height: 32px; }
    .side-nav__pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: var(--xui-space-xs);
      height: 22px;
      padding: 0 var(--xui-space-s) 0 var(--xui-space-xs);
      border-radius: 999px;
      background: var(--xui-bg-brand-secondary);
      color: var(--xui-content-primary);
      font-size: 13px;
      font-weight: 500;
    }
    .side-nav__pill--done { background: var(--xui-bg-success-secondary); }
    .side-nav__pill svg { color: var(--xui-content-brand-primary); }
    .side-nav__pill--done svg { color: var(--xui-content-success-primary); }
    .side-nav__foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: var(--xui-space-s) 0 0; border-top: 1px solid var(--xui-border-secondary); }

    .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .banner {
      display: flex;
      align-items: center;
      gap: var(--xui-space-s);
      min-height: 42px;
      padding: var(--xui-space-s) var(--xui-space-m);
      background: var(--xui-bg-warning-secondary);
      font-size: 14px;
    }
    .banner__icon { width: 18px; height: 18px; border-radius: var(--xui-radius-tag-sm); background: var(--xui-bg-inverse); color: var(--xui-content-inverse); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
    .banner__text { color: var(--xui-content-secondary); }
    .banner__action { margin-left: auto; font-weight: 600; color: var(--xui-content-primary); text-decoration: none; }

    /* Content column — the reference screen is a centered column */
    .page { width: 100%; max-width: min(964px, 100%); margin: 0 auto; padding: calc(var(--xui-space-xl) * 2) var(--xui-space-xl) var(--xui-space-xl); display: flex; flex-direction: column; gap: var(--xui-space-l); }

    /* Current setup / guide header card */
    .gs-head {
      display: flex;
      align-items: center;
      gap: var(--xui-space-s);
      padding: var(--xui-space-s);
      background: var(--xui-bg-primary);
      border: 1px solid var(--xui-border-secondary);
      border-radius: var(--xui-radius-button);
    }
    .gs-head .xui-rich-icon { width: 52px; height: 52px; }
    .gs-head__icon--store { background: var(--xui-bg-alert-secondary); color: var(--xui-content-primary); }
    .gs-head__icon--brand { background: var(--xui-bg-brand-secondary); color: var(--xui-content-primary); }
    .gs-head__titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .gs-head__caption { font-size: 14px; line-height: 18px; color: var(--xui-content-secondary); }
    .gs-head__title { font-family: var(--xui-font-body); font-size: 22px; line-height: 26px; font-weight: 500; }
    .gs-head__aside { display: flex; align-items: center; gap: var(--xui-space-m); padding-right: var(--xui-space-s); }

    /* Panel holding step cards */
    .gs-panel {
      background: var(--xui-bg-primary);
      border-radius: var(--xui-radius-button);
      padding: var(--xui-space-m);
      display: flex;
      flex-direction: column;
      gap: var(--xui-space-s);
    }
    .gs-panel__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--xui-space-m); flex-wrap: wrap; padding: var(--xui-space-s) var(--xui-space-s) var(--xui-space-s); }
    .gs-panel__titles { display: flex; flex-direction: column; gap: var(--xui-space-xs); }
    .gs-panel__title { font-family: var(--xui-font-body); font-size: 20px; line-height: 24px; font-weight: 500; }
    .gs-panel__desc { font-size: 14px; line-height: 20px; color: var(--xui-content-secondary); }

    /* Step card */
    .gs-step {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--xui-space-m);
      padding: var(--xui-space-m) var(--xui-space-m) var(--xui-space-m);
      border: 1px solid var(--xui-border-secondary);
      border-radius: var(--xui-radius-button);
      background: var(--xui-bg-primary);
      overflow: hidden;
      transition: box-shadow var(--page-duration-micro) ease;
    }
    .gs-step--current { min-height: 240px; }
    .gs-step--hover:hover { box-shadow: var(--xui-shadow-surface); }
    .gs-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--xui-space-xs);
      width: fit-content;
      height: 24px;
      padding: 0 var(--xui-space-s);
      border: 1px solid var(--xui-border-secondary);
      border-radius: var(--xui-radius-tag-lg);
      font-size: 13px;
      font-weight: 500;
      color: var(--xui-content-secondary);
    }
    .gs-chip--live { border-color: var(--xui-border-success); color: var(--xui-content-success-primary); }
    .gs-step__row { display: flex; gap: var(--xui-space-m); align-items: flex-start; }
    .gs-step__badge { width: 36px; height: 36px; border-radius: var(--xui-radius-button); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--xui-bg-secondary); color: var(--xui-content-tertiary); }
    .gs-step__badge--done { background: var(--xui-bg-success-secondary); color: var(--xui-content-success-primary); }
    .gs-step__badge--brand { background: var(--xui-bg-brand-secondary); color: var(--xui-content-primary); }
    .gs-step__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--xui-space-xs); }
    .gs-step__title { font-size: 17px; line-height: 22px; font-weight: 500; }
    .gs-step--current .gs-step__title { font-size: 18px; font-weight: 600; }
    .gs-step__desc { font-size: 15px; line-height: 21px; color: var(--xui-content-secondary); max-width: 560px; }
    .gs-step__actions { display: flex; align-items: center; gap: var(--xui-space-m); flex-wrap: wrap; }
    .gs-step__indent { padding-left: calc(36px + var(--xui-space-m)); display: flex; flex-direction: column; gap: var(--xui-space-m); }
    .gs-step__req { font-size: 14px; font-weight: 500; color: var(--xui-content-warning-secondary); }
    .gs-step__note { display: flex; gap: var(--xui-space-xs); align-items: center; font-size: 13px; line-height: 18px; color: var(--xui-content-tertiary); }
    .gs-step__note svg { color: var(--xui-content-success-primary); flex-shrink: 0; }
    .gs-step__body--current { display: flex; flex-direction: column; gap: var(--xui-space-m); max-width: 60%; margin-top: auto; }
    .gs-step--current .gs-step__body--current { padding-top: var(--xui-space-xl); }
    .gs-step--todo { opacity: 1; }
    .gs-step--todo .gs-step__title { color: var(--xui-content-primary); }

    /* Illustration on the current step card (mimics the reference storefront sketch) */
    .gs-illo { position: absolute; right: var(--xui-space-xl); top: 50%; transform: translateY(-50%); width: 260px; height: 150px; pointer-events: none; }
    .gs-illo__frame { position: absolute; inset: 0 0 0 30px; border: 6px solid var(--xui-bg-secondary); border-top-width: 14px; border-radius: var(--xui-radius-button); }
    .gs-illo__col { position: absolute; top: 34px; bottom: 6px; background: var(--xui-bg-secondary); }
    .gs-illo__badge { position: absolute; left: 0; top: 48px; width: 68px; height: 60px; border-radius: var(--xui-radius-card); background: var(--xui-bg-primary); box-shadow: var(--xui-shadow-surface); display: flex; align-items: center; justify-content: center; color: var(--xui-content-primary); }
    .gs-illo__badge svg { width: 34px; height: 34px; }

    /* Arrow text link ("Manage catalog →") */
    .gs-link { display: inline-flex; align-items: center; gap: var(--xui-space-xs); font-size: 15px; font-weight: 600; color: var(--xui-content-primary); text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
    .gs-link:hover { text-decoration: underline; }
    .gs-link:focus-visible { outline: 2px solid var(--xui-border-brand); outline-offset: 2px; }

    /* Completed initial setup summary */
    .gs-done-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--xui-space-s); }
    .gs-done-list li { display: flex; gap: var(--xui-space-s); align-items: flex-start; padding: var(--xui-space-m); border: 1px solid var(--xui-border-secondary); border-radius: var(--xui-radius-button); }
    .gs-done-list .gs-step__badge { width: 28px; height: 28px; }

    /* Advanced setup cards */
    .gs-adv { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--xui-space-s); }
    .gs-adv .gs-step { gap: var(--xui-space-m); }
    .gs-adv__top { display: flex; align-items: center; justify-content: space-between; gap: var(--xui-space-s); }
    .gs-adv__tags { display: flex; flex-wrap: wrap; gap: var(--xui-space-xs); }
    .gs-adv__meta { display: flex; gap: var(--xui-space-m); font-size: 13px; color: var(--xui-content-tertiary); }
    .gs-adv__foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--xui-space-s); }

    /* Guide overview */
    .gs-overview { display: flex; flex-direction: column; gap: var(--xui-space-m); padding: var(--xui-space-l); border: 1px solid var(--xui-border-secondary); border-radius: var(--xui-radius-button); }
    .gs-overview__cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--xui-space-l); }
    .gs-list { list-style: none; display: flex; flex-direction: column; gap: var(--xui-space-s); }
    .gs-list li { display: flex; gap: var(--xui-space-s); font-size: 15px; line-height: 21px; color: var(--xui-content-secondary); }
    .gs-list svg { flex-shrink: 0; margin-top: 2px; color: var(--xui-content-tertiary); }
    .gs-list__ok svg { color: var(--xui-content-success-primary); }
    .gs-overview__label { font-size: 13px; font-weight: 600; color: var(--xui-content-tertiary); }

    /* Alternative paths inside a step */
    .pg-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--xui-space-s); }
    .pg-choice {
      padding: var(--xui-space-m);
      border-radius: var(--xui-radius-button);
      border: 1px solid var(--xui-border-secondary);
      background: var(--xui-bg-primary);
      cursor: pointer;
      transition: border-color var(--page-duration-micro) ease, background-color var(--page-duration-micro) ease;
    }
    .pg-choice:hover { background: var(--xui-overlay-mono); }
    .pg-choice:focus-within { outline: 2px solid var(--xui-border-brand); outline-offset: 2px; }
    .pg-choice--checked { border-color: var(--xui-border-primary); background: var(--xui-bg-secondary); }
    .pg-instr { font-size: 14px; line-height: 20px; color: var(--xui-content-secondary); padding-left: var(--xui-space-m); border-left: 2px solid var(--xui-border-primary); }
    .pg-linkbtn { background: none; border: none; padding: 0; font-family: inherit; }

    /* Guide success */
    .gs-success { display: flex; flex-direction: column; gap: var(--xui-space-l); padding: var(--xui-space-l); border: 1px solid var(--xui-border-success); border-radius: var(--xui-radius-button); background: var(--xui-bg-primary); }
    .gs-success__head { display: flex; gap: var(--xui-space-m); align-items: flex-start; }
    .pg-summary { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--xui-space-s); }
    .pg-summary li { display: flex; flex-direction: column; gap: var(--xui-space-xs); padding: var(--xui-space-m); border-radius: var(--xui-radius-button); background: var(--xui-bg-secondary); }
    .pg-next { display: flex; align-items: center; gap: var(--xui-space-m); flex-wrap: wrap; padding: var(--xui-space-m); border-radius: var(--xui-radius-button); border: 1px dashed var(--xui-border-secondary); }
    .pg-next__text { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: var(--xui-space-xs); }

    /* Prototype controls (not part of the product UI) */
    .proto {
      position: fixed;
      left: calc(316px + var(--xui-space-m));
      bottom: var(--xui-space-m);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: var(--xui-space-s);
      flex-wrap: wrap;
      padding: var(--xui-space-s) var(--xui-space-m);
      background: var(--xui-bg-primary);
      border: 1px dashed var(--xui-border-brand-extra);
      border-radius: var(--xui-radius-button);
      box-shadow: var(--xui-shadow-popover);
      max-width: calc(100vw - 316px - var(--xui-space-xl));
    }
    .proto__toggle { cursor: pointer; border: none; font-family: inherit; }
    .proto__body { display: flex; align-items: center; gap: var(--xui-space-s); flex-wrap: wrap; }
    .proto--collapsed { padding: var(--xui-space-xs); }
    .proto--collapsed .proto__body { display: none; }
    .proto__label { font-size: 12px; color: var(--xui-content-tertiary); }
    /* Typography — B2B (Pilat headings) */
    .pg-h1 { font-family: var(--xui-font-heading-b2b); font-size: 32px; line-height: 38px; font-weight: 400; }
    .pg-h2 { font-family: var(--xui-font-heading-b2b); font-size: 24px; line-height: 28px; font-weight: 400; }
    .pg-h3 { font-family: var(--xui-font-heading-b2b); font-size: 20px; line-height: 24px; font-weight: 600; }
    .pg-body-lg { font-size: 18px; line-height: 26px; color: var(--xui-content-secondary); }
    .pg-body { font-size: 16px; line-height: 22px; color: var(--xui-content-secondary); }
    .pg-body-sm { font-size: 14px; line-height: 20px; color: var(--xui-content-secondary); }
    .pg-caption { font-size: 12px; line-height: 16px; color: var(--xui-content-tertiary); }
    .pg-strong { color: var(--xui-content-primary); font-weight: 500; }

    .pg-header { display: flex; flex-direction: column; gap: var(--xui-space-s); }
    .pg-header__row { display: flex; align-items: center; gap: var(--xui-space-m); flex-wrap: wrap; }
    .pg-section { display: flex; flex-direction: column; gap: var(--xui-space-m); }
    .pg-section__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--xui-space-m); flex-wrap: wrap; }
    .pg-section__titles { display: flex; flex-direction: column; gap: var(--xui-space-xs); }

    .pg-card {
      background: var(--xui-bg-primary);
      border: 1px solid var(--xui-border-secondary);
      border-radius: var(--xui-radius-card);
      box-shadow: var(--xui-shadow-surface);
      padding: var(--xui-space-l);
    }
    .pg-card--flat { box-shadow: none; }
    .pg-card--hover { transition: box-shadow var(--page-duration-micro) ease, transform var(--page-duration-micro) ease; }
    .pg-card--hover:hover { box-shadow: var(--xui-shadow-surface-hover); transform: translateY(-2px); }

    /* Embedded Promotions + Catalog screens */
    .pg-form { display: flex; flex-direction: column; gap: var(--xui-space-l); max-width: 720px; }
    .pg-form__row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--xui-space-m); }
    .pg-form__group { display: flex; flex-direction: column; gap: var(--xui-space-s); }
    .pg-form__actions { display: flex; gap: var(--xui-space-m); flex-wrap: wrap; }
    .pg-table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
    .pg-table th { text-align: left; font-weight: 500; color: var(--xui-content-tertiary); padding: var(--xui-space-s) var(--xui-space-m); border-bottom: 1px solid var(--xui-border-secondary); }
    .pg-table td { padding: var(--xui-space-m); border-bottom: 1px solid var(--xui-border-secondary); color: var(--xui-content-primary); vertical-align: middle; }
    .pg-table tr:last-child td { border-bottom: none; }
    .pg-table__muted { color: var(--xui-content-tertiary); }
    .pg-table-wrap { overflow-x: auto; padding: 0; }
    .pg-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--xui-space-s); padding: calc(var(--xui-space-xl) * 1.5) var(--xui-space-l); }
    .pg-empty svg { color: var(--xui-content-tertiary); }
    .pg-review { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--xui-space-m); }
    .pg-review__item { display: flex; flex-direction: column; gap: var(--xui-space-xs); }
    .pg-price-old { text-decoration: line-through; color: var(--xui-content-tertiary); margin-right: var(--xui-space-s); }
    .pg-price-new { color: var(--xui-content-success-primary); font-weight: 600; }

    /* Web Shop preview */
    .pg-shop { display: flex; flex-direction: column; gap: var(--xui-space-l); }
    .pg-shop__frame { border: 1px solid var(--xui-border-secondary); border-radius: var(--xui-radius-card); overflow: hidden; background: var(--xui-bg-secondary); }
    .pg-shop__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--xui-space-m); padding: var(--xui-space-m) var(--xui-space-l); background: var(--xui-bg-primary); border-bottom: 1px solid var(--xui-border-secondary); }
    .pg-shop__body { padding: var(--xui-space-l); display: flex; flex-direction: column; gap: var(--xui-space-l); }
    .pg-shop__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--xui-space-m); }
    .pg-shop__item { display: flex; flex-direction: column; gap: var(--xui-space-s); padding: var(--xui-space-m); }
    .pg-shop__thumb { height: 96px; border-radius: var(--xui-radius-button); background: var(--xui-overlay-mono); display: flex; align-items: center; justify-content: center; color: var(--xui-content-tertiary); position: relative; }
    .pg-shop__thumb .xui-tag { position: absolute; top: var(--xui-space-s); left: var(--xui-space-s); }
    .pg-shop__redeem { display: flex; gap: var(--xui-space-s); align-items: flex-end; flex-wrap: wrap; }
    .pg-shop__redeem .xui-field-group { max-width: 320px; }
    .pg-block { display: flex; align-items: center; gap: var(--xui-space-m); padding: var(--xui-space-m); border-radius: var(--xui-radius-button); border: 1px solid var(--xui-border-secondary); background: var(--xui-bg-primary); }
    .pg-block--dashed { border-style: dashed; background: transparent; }
    .pg-block__text { flex: 1; display: flex; flex-direction: column; gap: 2px; }

    /* Floating setup widget (D3-FR10) */
    .pg-widget {
      position: fixed;
      right: var(--xui-space-l);
      bottom: var(--xui-space-l);
      width: 340px;
      max-width: calc(100vw - var(--xui-space-xl));
      background: var(--xui-bg-primary);
      border: 1px solid var(--xui-ctrl-brand-secondary-border);
      border-radius: var(--xui-radius-card);
      box-shadow: var(--xui-shadow-popover);
      padding: var(--xui-space-m);
      display: flex;
      flex-direction: column;
      gap: var(--xui-space-m);
      z-index: 50;
      animation: pg-rise var(--page-duration-macro) var(--page-easing) both;
    }
    .pg-widget__head { display: flex; align-items: flex-start; gap: var(--xui-space-s); }
    .pg-widget__titles { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .pg-widget__actions { display: flex; align-items: center; justify-content: space-between; gap: var(--xui-space-s); }
    /* keep page content clear of the floating widget */
    .has-widget .page { padding-bottom: calc(var(--xui-space-xl) * 6); }
    .has-widget-mini .page { padding-bottom: calc(var(--xui-space-xl) * 3); }
    .pg-widget--collapsed { width: auto; padding: var(--xui-space-s) var(--xui-space-m); flex-direction: row; align-items: center; cursor: pointer; }

    /* Motion */
    @keyframes pg-fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pg-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .page > * { animation: pg-fadeSlideUp var(--page-duration-macro) var(--page-easing) both; }
    .page > *:nth-child(2) { animation-delay: 60ms; }
    .page > *:nth-child(3) { animation-delay: 120ms; }
    .page > *:nth-child(4) { animation-delay: 180ms; }
    .page > *:nth-child(5) { animation-delay: 240ms; }
    @media (prefers-reduced-motion: reduce) {
      .page > *, .pg-widget { animation: none; }
      .pg-card--hover:hover { transform: none; }
    }

    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Responsive */
    @media (max-width: 1100px) {
      .gs-illo { display: none; }
      .gs-step__body--current { max-width: none; }
    }
    @media (max-width: 860px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--xui-border-secondary); }
      .side-nav { flex-direction: row; overflow-x: auto; }
      .side-nav__group-title, .side-nav__sep, .side-nav__chev, .side-nav__foot, .side-nav__sub { display: none; }
      .side-nav__item { white-space: nowrap; }
      .topbar { gap: var(--xui-space-s); }
      .topbar { overflow: hidden; }
      .topbar__account-name, .topbar__right > span, .topbar__project-name, .topbar__acct-id, .topbar__right > a:not(:last-child) { display: none; }
      .topbar__account { border-right: none; padding-right: 0; }
      .page { padding: var(--xui-space-l) var(--xui-space-m) calc(var(--xui-space-xl) * 4); }
      .gs-head { flex-wrap: wrap; }
      .gs-step__indent { padding-left: 0; }
      .proto { left: var(--xui-space-m); max-width: calc(100vw - var(--xui-space-xl)); }
    }
    /* Light Business Account look: flat cards, Aktiv Grotesk headings (reference screen) */
    .pg-h1 { font-family: var(--xui-font-body); font-size: 28px; line-height: 34px; font-weight: 500; }
    .pg-h2 { font-family: var(--xui-font-body); font-size: 22px; line-height: 26px; font-weight: 500; }
    .pg-h3 { font-family: var(--xui-font-body); font-size: 18px; line-height: 22px; font-weight: 600; }
    .pg-card { border-radius: var(--xui-radius-button); box-shadow: none; }
    .pg-shop__frame { border-radius: var(--xui-radius-button); }

    /* Catalog frames — embedded Catalog UI inside guide steps (Bundles PRD D3) */
    .b-frame { border: 1px solid var(--xui-border-secondary); border-radius: var(--xui-radius-button); background: var(--xui-bg-primary); overflow: hidden; }
    .b-frame__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--xui-space-m); flex-wrap: wrap; padding: var(--xui-space-s) var(--xui-space-m); background: var(--xui-bg-secondary); border-bottom: 1px solid var(--xui-border-secondary); }
    .b-frame__title { display: inline-flex; align-items: center; gap: var(--xui-space-s); font-size: 13px; font-weight: 600; color: var(--xui-content-secondary); }
    .b-frame__body { padding: var(--xui-space-m); display: flex; flex-direction: column; gap: var(--xui-space-m); }
    .b-frame__body .pg-form { max-width: none; }
    .b-frame--down { display: flex; flex-direction: column; gap: var(--xui-space-m); padding: var(--xui-space-m); }
    .b-frame__cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--xui-space-m); }
    .b-mini { padding: var(--xui-space-m); border: 1px dashed var(--xui-border-secondary); border-radius: var(--xui-radius-button); gap: var(--xui-space-m); }
    .b-image { display: flex; gap: var(--xui-space-m); align-items: flex-start; flex-wrap: wrap; }
    .b-image__drop { width: 120px; height: 120px; flex-shrink: 0; border: 1px dashed var(--xui-border-secondary); border-radius: var(--xui-radius-button); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--xui-space-xs); color: var(--xui-content-tertiary); background: var(--xui-bg-secondary); }
    .b-chips { display: inline-flex; gap: var(--xui-space-xs); align-items: center; flex-wrap: wrap; }
    .b-danger { color: var(--xui-content-alert-primary); }
    .gs-step--current .b-frame { position: relative; z-index: 1; }

    /* keep the last form clear of the prototype panel */
    .page { padding-bottom: calc(var(--xui-space-xl) * 5); }
  </style>

  function field(id, label, input, opts) {

  /* ══════════════════ Views ══════════════════ */

    var initial;
    if (S.setupDone) {
      initial = '<section class="gs-panel" aria-labelledby="h-initial">' +

        '<div class="gs-step__text"><h3 class="gs-step__title">' + esc(todo.todo.title) + '</h3><p class="gs-step__desc">' + esc(todo.todo.desc) + '</p></div></div>' +

    return flashHtml() + head + (S.setupDone ? adv + initial : initial + adv);
  }

  function capCardPromo(gid) {
    var g = GUIDES[gid], state = cardState(gid), pr = progress(gid), gs = PJ().guides[gid];
    var badge = state === 'live' ? status('success', 'Live') : state === 'blocked' ? status('default', 'Blocked') : gs.started && !pr.complete ? status('warning', 'In progress') : status('neutral', 'Available');
    var foot;
    if (state === 'live') {
      var openHref = gid === 'bundles' ? '#guide/bundles?section=manage' : '#promotions?tab=' + (gid === 'sales' ? (PJ().promo.kind === 'bonus' ? 'bonus' : 'discount') : (PJ().code.type === 'coupon' ? 'coupons' : 'codes'));
      foot = '<div class="gs-step__actions">' + darkBtn('Open', { href: openHref }) + arrowLink('View guide', '#guide/' + gid) + '</div>';
    } else if (state === 'available') {
      foot = (gs.started && !pr.complete ? progressBar(pr.done, pr.total, { size: 'sm', label: 'Step ' + (pr.current + 1) + ' of ' + pr.total + ': ' + g.steps[pr.current].title }) : '') +
        '<div class="gs-step__actions">' + darkBtn('Set up', { href: '#guide/' + gid }) + '</div>';
    } else {
      foot = '<div class="gs-step__actions">' + darkBtn('Set up', { disabled: true }) + '<span class="gs-step__req">Requires initial setup first</span></div>';
    }
    return '<article class="gs-step gs-step--hover" aria-labelledby="cap-' + gid + '">' +
      '<div class="gs-adv__top">' + chip('Advanced') + badge + '</div>' +
      '<div class="gs-step__row"><span class="gs-step__badge ' + (state === 'blocked' ? '' : 'gs-step__badge--brand') + '">' + ic(g.icon, 20) + '</span>' +
      '<div class="gs-step__text"><h3 class="gs-step__title" id="cap-' + gid + '">' + esc(g.name) + '</h3><p class="gs-step__desc">' + esc(g.short()) + '</p></div></div>' +
      '<div class="gs-step__indent"><div class="gs-adv__tags">' + g.examples().map(function (x) { return '<span class="xui-tag xui-tag--xs xui-tag--secondary">' + esc(x) + '</span>'; }).join('') + '</div>' +
      '<div class="gs-adv__meta"><span>' + g.steps.length + ' steps</span><span>About ' + g.minutes + ' min</span><span>Self-serve</span></div>' +
      '<div class="gs-adv__foot">' + foot + '</div></div></article>';
  }

  /* Setup guide (D3) — same step-card pattern as Get started */
  function viewGuide(gid) {
    var g = GUIDES[gid];
    if (!g) return viewNotFound();
    if (!S.setupDone) {
      flash = { tone: 'warning', title: 'Finish your initial setup first', msg: 'Setup guides for Advanced tools unlock after your Game Store goes online.' };
      location.hash = '#get-started';
      return '';
    }
    var gs = PJ().guides[gid], pr = progress(gid), state = cardState(gid);
    PJ().lastGuide = gid; save();
    var badge = pr.complete || state === 'live' ? status('success', 'Live') : gs.started ? status('warning', 'In progress') : status('neutral', 'Available');

    var head = crumbs([{ label: 'Get started', href: '#get-started' }, { label: 'Advanced setup', href: '#get-started' }, { label: g.name }]) +
      '<section class="gs-head" aria-label="Setup guide">' +
      '<div class="xui-rich-icon xui-rich-icon--rounded xui-rich-icon--lg"><div class="xui-rich-icon__icon gs-head__icon--brand">' + ic(g.icon, 24) + '</div></div>' +
      '<div class="gs-head__titles"><span class="gs-head__caption">Setup guide · ' + pr.done + ' of ' + pr.total + ' steps done</span><h1 class="gs-head__title">' + esc(g.guideName || g.name) + '</h1></div>' +
      '<div class="gs-head__aside">' + badge + '<a class="xui-btn xui-btn--secondary xui-btn--mono xui-btn--sm" href="#get-started">' + ic('arrowL', 20, 'xui-btn__icon') + '<span class="xui-btn__label">Get started</span></a></div></section>';

    var body = '';
    if (pr.complete) body += successPanel(gid);

    var overview = '<div class="gs-overview">' +
      '<div class="gs-step__text"><span class="gs-overview__label">Overview</span><h2 class="gs-step__title" style="font-size: 20px;">' + esc(g.goal) + '</h2>' +
      '<p class="gs-step__desc">' + g.steps.length + ' steps · about ' + g.minutes + ' minutes. Your progress is saved, so you can leave and come back at any time.</p></div>' +
      '<div class="gs-overview__cols"><div class="gs-step__text"><span class="gs-overview__label">You will</span><ul class="gs-list">' +
      g.accomplish.map(function (a) { return '<li>' + ic('check', 16) + '<span>' + esc(a) + '</span></li>'; }).join('') + '</ul></div>' +
      '<div class="gs-step__text"><span class="gs-overview__label">Before you start, prepare</span><ul class="gs-list">' +
      g.prep().map(function (p) { return '<li class="' + (p.done ? 'gs-list__ok' : '') + '">' + ic(p.done ? 'checkCr' : 'info', 16) + '<span>' + esc(p.text) + (p.done ? ' — ready' : '') + '</span></li>'; }).join('') + '</ul></div></div>' +
      (!gs.started && !pr.complete ? '<div class="gs-step__actions">' + darkBtn('Start setup', { action: 'start-guide', data: { guide: gid }, size: 'md' }) + '</div>' : '') + '</div>';

    /* Order like the reference: current step, then done steps, then remaining steps */
    var idx = g.steps.map(function (s, i) { return i; });
    var order = gs.started && !pr.complete

    if (gs.started && !pr.complete) body += '<section class="gs-panel" aria-label="Guide overview">' + overview + '</section>';
    if (gid === 'bundles') body += manageSection();
    return flashHtml() + head + body;
  }

  function stepHtmlBase(g, st, i, pr, gs) {
    var done = st.done(), current = pr.current === i && gs.started && !pr.complete;
    var label = 'Step ' + (i + 1) + ' of ' + g.steps.length;
    var cta = stepCta(g, st);
    var ctaHref = cta ? cta.href + (cta.href.indexOf('?') > -1 ? '&' : '?') + 'guide=' + g.id : null;

    if (current) {
      var detail = '';
      if (st.paths) {
        var sel = gs.paths[st.id], paths = st.paths();
        detail += '<div class="pg-choices" role="radiogroup" aria-label="' + esc(st.title) + '">' +
          paths.map(function (p) { return radio('path-' + g.id + '-' + st.id, p.id, p.label, p.desc, p.id === sel); }).join('') + '</div>';
        var chosen = paths.filter(function (p) { return p.id === sel; })[0];
        if (chosen && chosen.instr) detail += '<p class="pg-instr">' + esc(chosen.instr) + '</p>';
      }
      var actions = st.detect === 'choice'
        ? darkBtn(st.choiceLabel, { action: 'save-choice', data: { guide: g.id, step: st.id } })
        : (cta ? darkBtn(cta.label, { href: ctaHref }) : '');
      if (st.detect === 'confirm') actions += btn('I’ve done this', { variant: 'secondary', tone: 'mono', size: 'sm', action: 'confirm-step', data: { guide: g.id, step: st.id } });
      return '<article class="gs-step gs-step--current" id="current-step" aria-current="step">' + chip(label) + (st.paths ? '' : illo(g.icon)) +
        '<div class="gs-step__body--current"' + (st.paths ? ' style="max-width: none;"' : '') + '><div class="gs-step__text"><h2 class="gs-step__title">' + esc(st.title) + '</h2><p class="gs-step__desc">' + esc(st.desc()) + '</p></div>' +
        detail + '<div class="gs-step__actions">' + actions + '</div>' +
        (st.detect === 'auto' ? '<p class="gs-step__note">' + ic('info', 14) + 'Marked done automatically when the guide detects it in your account</p>' : '') + '</div></article>';
    }
    if (done) {
      var links = (cta ? arrowLink('Review', ctaHref) : '') +
        (st.detect === 'choice' ? '<button class="gs-link" type="button" data-action="reopen-choice" data-guide="' + g.id + '" data-step="' + st.id + '">Change' + ic('arrowR', 16) + '</button>' : '');
      return '<article class="gs-step">' + chip(label) + '<div class="gs-step__row"><span class="gs-step__badge gs-step__badge--done">' + ic('check', 18) + '</span>' +
        '<div class="gs-step__text"><h3 class="gs-step__title">' + esc(st.title) + '</h3><p class="gs-step__desc">' + esc(st.doneNote()) + '</p></div></div>' +
        (links ? '<div class="gs-step__indent"><div class="gs-step__actions">' + links + '</div></div>' : '') + '</article>';
    }
    /* To do: locked until the previous step is done, like "Requires a Game Store first" */
    var needs = pr.current !== null && pr.current < i ? 'Requires step ' + (pr.current + 1) + ' first' : (gs.started ? '' : 'Start the guide first');
    return '<article class="gs-step gs-step--todo">' + chip(label) + '<div class="gs-step__row"><span class="gs-step__badge">' + (i + 1) + '</span>' +
      '<div class="gs-step__text"><h3 class="gs-step__title">' + esc(st.title) + '</h3><p class="gs-step__desc">' + esc(st.desc()) + '</p></div></div>' +
      '<div class="gs-step__indent"><div class="gs-step__actions">' + darkBtn(st.detect === 'choice' ? st.choiceLabel : (cta ? cta.label : 'Continue'), { disabled: true }) +
      (needs ? '<span class="gs-step__req">' + esc(needs) + '</span>' : '') + '</div></div></article>';
  }

  function successPanelPromo(gid) {
    var pj = PJ(), g = GUIDES[gid], other = gid === 'sales' ? 'codes' : 'sales';
    var summary, title;
    if (gid === 'sales') {
      var p = pj.promo;
      title = p.kind === 'discount' ? 'Your discount is live' : 'Your bonus offer is live';
      summary = [
        { k: 'Offer', v: p.kind === 'discount' ? p.percent + '% off' : bonusById(p.bonus).name + ' as a bonus' },
        { k: 'Applies to', v: p.items.map(function (id) { return itemById(id).name; }).join(', ') },
        { k: 'Runs', v: p.start + ' to ' + p.end },
        { k: 'Regions', v: p.regions === 'all' ? 'All regions' : 'Selected regions' }

    } else {
      var c = pj.code;
      title = c.type === 'coupon' ? 'Your coupons are live' : 'Your promo code is live';
      summary = [
        { k: c.type === 'coupon' ? 'Coupons' : 'Code', v: c.type === 'coupon' ? c.count + ' unique codes' : c.value },
        { k: 'Reward', v: rewardLabel(pj.guides.codes.chosen.reward).replace(/^./, function (m) { return m.toUpperCase(); }) },
        { k: 'Valid', v: c.from + ' to ' + c.to },
        { k: 'Redemptions', v: c.type === 'coupon' ? 'Once per coupon' : c.uses + ' in total' }
      ];
    }
    var otherDone = cardState(other) === 'live' && progress(other).complete;
    var next = otherDone
      ? '<div class="pg-next"><div class="pg-next__text"><span class="pg-caption">Up next</span><span class="pg-strong">Both promotion tools are live</span><span class="pg-body-sm">Track redemptions and revenue in Analytics.</span></div>' + darkBtn('Open Analytics', { variant: 'secondary', href: '#page/analytics' }) + '</div>'
      : '<div class="pg-next"><span class="gs-step__badge gs-step__badge--brand">' + ic(GUIDES[other].icon, 20) + '</span>' +
        '<div class="pg-next__text"><span class="pg-caption">Suggested next</span><span class="pg-strong">' + esc(GUIDES[other].name) + '</span><span class="pg-body-sm">' + esc(GUIDES[other].short()) + '</span></div>' +

    var parts = h.split('?');

    (parts[1] || '').split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
    return { path: parts[0] || 'get-started', q: q, raw: h };
  }

  function render() {
    var r = parse(), seg = r.path.split('/'), html;
    if (r.q.guide && !GUIDES[r.q.guide]) delete r.q.guide;
    switch (seg[0]) {
      case 'guide': html = viewGuide(seg[1]); break;
      case 'promotions':
        if (seg[1] === 'new') html = viewPromoNew(r.q);
        else if (seg[1] === 'schedule') html = viewPromoSchedule(r.q);
        else if (seg[1] === 'review') html = viewPromoReview(r.q);
        else if (seg[1] === 'code') html = viewCodeCreate(r.q);
        else if (seg[1] === 'code-limits') html = viewCodeLimits(r.q);
        else html = viewPromotions(r.q);
        break;
      case 'catalog': html = viewCatalog(r.q); break;
      case 'webshop': html = viewWebshop(r.q); break;
      case 'page': html = viewPlaceholder(seg[1]); break;
      default: html = viewGetStarted();
    }
    if (html === '') return; /* redirected */
    var view = document.getElementById('view');
    view.innerHTML = html;
    renderNav(r.path);
    renderControls();
    renderWidget(r.path);

  }

      case 'reset': S = freshState(); flash = null; save(); go('#get-started'); break;

      case 'save-choice':
        pj.guides[gid].chosen[sid] = pj.guides[gid].paths[sid]; pj.guides[gid].started = true; save(); render(); focusCurrent(); break;
      case 'reopen-choice': delete pj.guides[gid].chosen[sid]; save(); render(); break;

      var k = f.getAttribute('data-kind');
      var prev = pj.promo && pj.promo.kind === k ? pj.promo : {};

      Object.assign(pj.promo, { scheduled: true, start: fd.get('start'), end: fd.get('end'), regions: fd.get('regions'), limit: fd.get('limit') });

      BA().types.map(function (t, i) { return radio('b-itype', t, t, '', i === 0); }).join('') + '</div></div>' +
      field('b-iprice', 'Price, USD', input('b-iprice', 'type="number" min="0" step="0.01" required aria-required="true" value="4.99"'), { required: true }) +
      '<div class="pg-form__actions">' + darkBtn('Create item', { submit: true }) + '</div></form></div>' +

  function frameDescribe(b) {
    var a = BA(), groups = catGroups();

      '<div class="pg-form__group" style="flex: 1;">' +
      field('b-sku', 'SKU', input('b-sku', 'type="text" required aria-required="true" pattern="[a-z0-9_.\\-]{3,64}" value="' + esc(b ? b.sku : a.sku) + '"' + (b ? ' readonly' : '')), { required: true, helper: 'Lowercase letters, numbers, dots, dashes, or underscores. Can’t be changed later.' }) +
      field('b-name', 'Name', input('b-name', 'type="text" required aria-required="true" value="' + esc(b ? b.name : a.bundleName) + '"'), { required: true }) + '</div></div>' +

  function frameContents(b) {
    if (!b) return '<p class="gs-step__desc">Save the bundle details first.</p>';

  function framePrice(b) {

      '<div class="b-paid"' + (free ? ' hidden' : '') + '><div class="pg-form__row">' +

  function frameLimits(b) {

        '<h3 class="gs-step__title">' + esc(eb.name) + '</h3>' +
        '<nav class="xui-tabs xui-tabs--line xui-tabs--sm" role="tablist" aria-label="Bundle settings">' +

      '<p class="gs-panel__desc">Change contents, price, limits, or the display period, or remove a bundle. Changes apply in your Game Store right away.</p></div>' +
      darkBtn('Build another bundle', { action: 'b-new', variant: 'secondary', arrow: false }) + '</div>' +
      (list.length ? catalogFrame('list', 'Bundles', '<div class="pg-table-wrap"><table class="pg-table"><thead><tr><th>Bundle</th><th>Contents</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>')
        : '<p class="gs-step__desc" style="padding: 0 var(--xui-space-s);">No bundles yet. Bundles you build appear here.</p>') + editor + '</section>';

  /* ── Overrides: card, steps, success, catalog, shop ── */
  function capCard(gid) {
    if (gid === 'regional') return regionalCard();
    if (gid !== 'bundles') return capCardPromo(gid);
    return capCardPromo(gid).replace('<div class="gs-adv__top">' + chip('Advanced'), '<div class="gs-adv__top"><span class="b-chips">' + chip('Advanced') + '<span class="xui-tag xui-tag--xs xui-tag--brand-extra">New</span></span>');
  }
  function regionalCard() {
    var blocked = !S.setupDone;
    return '<article class="gs-step gs-step--hover" aria-labelledby="cap-regional"><div class="gs-adv__top">' + chip('Advanced') + (blocked ? status('default', 'Blocked') : status('neutral', 'Available')) + '</div>' +
      '<div class="gs-step__row"><span class="gs-step__badge ' + (blocked ? '' : 'gs-step__badge--brand') + '">' + ic('globe', 20) + '</span><div class="gs-step__text"><h3 class="gs-step__title" id="cap-regional">Regional restrictions</h3>' +
      '<p class="gs-step__desc">Choose the countries where items and bundles are sold or hidden.</p></div></div>' +

  }

  function stepHtml(g, st, i, pr, gs) {
    if (g.id !== 'bundles' || !st.frameStep) return stepHtmlBase(g, st, i, pr, gs);
    var done = st.done(), current = pr.current === i && gs.started && !pr.complete;
    var editing = gs.editing === st.id && done;
    var label = 'Step ' + (i + 1) + ' of ' + g.steps.length;
    var chips = chip(label) + (st.optional ? ' ' + chip('Optional') : '');
    if (current || editing) {
      var paths = '';
      if (st.paths) {
        var sel = gs.paths[st.id];
        paths = '<div class="pg-choices" role="radiogroup" aria-label="' + esc(st.title) + '">' +
          st.paths().map(function (p) { return radio('path-' + g.id + '-' + st.id, p.id, p.label, p.desc, p.id === sel); }).join('') + '</div>';
      }
      return '<article class="gs-step gs-step--current" id="current-step" aria-current="step"><div class="b-chips">' + chips + '</div>' +
        '<div class="gs-step__text"><h2 class="gs-step__title">' + esc(st.title) + '</h2><p class="gs-step__desc">' + esc(st.desc()) + '</p></div>' +
        paths + frameFor(st.id, draft()) +
        '<p class="gs-step__note">' + ic('info', 14) + (st.optional ? 'Optional. Skipped steps count as done, and you can reopen them at any time' : 'Marked done automatically when you save in the Catalog tools above') + '</p>' +
        (editing ? '<div class="gs-step__actions"><button class="gs-link" type="button" data-action="b-edit-close">Done editing' + ic('arrowR', 16) + '</button></div>' : '') + '</article>';
    }
    if (done) {
      return '<article class="gs-step"><div class="b-chips">' + chips + '</div><div class="gs-step__row"><span class="gs-step__badge gs-step__badge--done">' + ic('check', 18) + '</span>' +
        '<div class="gs-step__text"><h3 class="gs-step__title">' + esc(st.title) + '</h3><p class="gs-step__desc">' + esc(st.doneNote()) + '</p></div></div>' +
        '<div class="gs-step__indent"><div class="gs-step__actions"><button class="gs-link" type="button" data-action="b-edit-step" data-step="' + st.id + '">' + (st.optional && gs.skipped[st.id] && !(draft() && draft().limits) ? 'Reopen' : 'Edit') + ic('arrowR', 16) + '</button></div></div></article>';
    }
    var needs = pr.current !== null && pr.current < i ? 'Requires step ' + (pr.current + 1) + ' first' : (gs.started ? '' : 'Start the guide first');
    return '<article class="gs-step gs-step--todo"><div class="b-chips">' + chips + '</div><div class="gs-step__row"><span class="gs-step__badge">' + (i + 1) + '</span>' +
      '<div class="gs-step__text"><h3 class="gs-step__title">' + esc(st.title) + '</h3><p class="gs-step__desc">' + esc(st.desc()) + '</p></div></div>' +
      (needs ? '<div class="gs-step__indent"><span class="gs-step__req">' + esc(needs) + '</span></div>' : '') + '</article>';
  }

  function successPanel(gid) {
    if (gid !== 'bundles') return successPanelPromo(gid);
    var d = draft() || BJ().bundles[BJ().bundles.length - 1];
    if (!d) return '';
    var summary = [{ k: 'Bundle', v: d.name }, { k: 'Contents', v: contentsLabel(d) }, { k: 'Price', v: priceLabel(d) }, { k: 'Display', v: limitsLabel(d) }];
    return '<section class="gs-success" aria-labelledby="success-title">' +
      '<div class="gs-success__head"><span class="gs-step__badge gs-step__badge--done" style="width: 48px; height: 48px;">' + ic('trophy', 26) + '</span><div class="gs-step__text">' +
      '<span class="gs-overview__label">Well done!</span><h2 class="gs-step__title" id="success-title" style="font-size: 22px; line-height: 26px;">“' + esc(d.name) + '” is live</h2>' +
      '<p class="gs-step__desc">Players can buy it in your Game Store now. The Bundles card on Get started shows it as Live.</p></div></div>' +
      '<ul class="pg-summary">' + summary.map(function (s) { return '<li><span class="pg-caption">' + esc(s.k) + '</span><span class="pg-strong">' + esc(s.v) + '</span></li>'; }).join('') + '</ul>' +
      '<div class="gs-step__actions">' + darkBtn('Manage bundles', { href: '#guide/bundles?section=manage' }) + arrowLink('Back to Get started', '#get-started') + '</div>' +
      '<div class="pg-next"><span class="gs-step__badge gs-step__badge--brand">' + ic('discount', 20) + '</span><div class="pg-next__text"><span class="pg-caption">Suggested next</span>' +
      '<span class="pg-strong">Sales, discounts & offers</span><span class="pg-body-sm">Put your new bundle on sale for a limited time.</span></div>' + darkBtn('Set up', { href: '#guide/sales' }) + '</div></section>';
  }

  function viewCatalog(q) {
    var seg = parse().path.split('/');
    if (seg[1] === 'frame') {
      /* Fallback: full Catalog screen for the same action (D3-FR7) */
      var b = q.bundle ? bundleById(q.bundle) : draft();
      var inner = { prepare: framePrepare, describe: frameDescribe, contents: frameContents, price: framePrice, limits: frameLimits }[q.step];
      return crumbs([{ label: 'Item catalog', href: '#catalog' }, { label: 'Bundles', href: '#catalog?tab=bundles' }, { label: 'Edit' }]) +
        '<section class="gs-head"><div class="xui-rich-icon xui-rich-icon--rounded xui-rich-icon--lg"><div class="xui-rich-icon__icon gs-head__icon--brand">' + ic('boxes', 24) + '</div></div>' +
        '<div class="gs-head__titles"><span class="gs-head__caption">Item catalog</span><h1 class="gs-head__title">' + esc(b ? b.name : 'New bundle') + '</h1></div>' +
        '<div class="gs-head__aside"><a class="xui-btn xui-btn--secondary xui-btn--mono xui-btn--sm" href="#guide/bundles">' + ic('arrowL', 20, 'xui-btn__icon') + '<span class="xui-btn__label">Back to guide</span></a></div></section>' +
        flashHtml() + '<section class="gs-panel">' + (inner ? inner(b) : '') + '</section>';

        return '<a class="xui-tab' + (t.id === tab ? ' xui-tab--active' : '') + '" role="tab" aria-selected="' + (t.id === tab) + '" href="#catalog?tab=' + t.id + '">' + t.l + '</a>';

  function bundleShopCards() {
    return BJ().bundles.filter(isActive).map(function (b) {
      return '<div class="pg-card pg-card--flat pg-shop__item"><div class="pg-shop__thumb"><span class="xui-tag xui-tag--xs xui-tag--brand-extra">Bundle</span>' + ic('boxes', 32) + '</div>' +
        '<span class="pg-strong">' + esc(b.name) + '</span><span class="pg-caption">' + esc(contentsLabel(b)) + '</span><span>' + esc(b.price.free ? 'Free' : priceLabel(b).split(' (default)')[0].split(' · ')[0]) + '</span>' +
        btn(b.price.free ? 'Test claim' : 'Test purchase', { size: 'xs', variant: 'secondary', action: 'b-test-buy', data: { id: b.id }, full: true }) + '</div>';
