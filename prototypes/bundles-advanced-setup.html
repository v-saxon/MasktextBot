  function bundleMsg(t, m) { flash = { tone: 'success', title: t, msg: m }; }

  /* ── Events for bundles ── */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action'), b = BJ(), gs = PJ().guides.bundles;
    switch (a) {
      case 'set-catalog': S.catalogEmpty = el.getAttribute('data-value') === 'empty'; save(); render(); break;
      case 'set-frames': S.framesDown = el.getAttribute('data-value') === 'down'; save(); render(); break;
      case 'b-skip': gs.skipped.limits = true; save(); render(); focusCurrent(); break;
      case 'b-edit-step': gs.editing = el.getAttribute('data-step'); save(); render(); focusCurrent(); break;
      case 'b-edit-close': gs.editing = null; save(); render(); break;
      case 'b-manage-edit': b.manage = { id: el.getAttribute('data-id'), tab: 'contents' }; b.confirmRemove = null; save(); render(); scrollToId('manage'); break;
      case 'b-manage-tab': b.manage.tab = el.getAttribute('data-tab'); save(); render(); scrollToId('manage'); break;
      case 'b-manage-close': b.manage = null; save(); render(); break;
      case 'b-remove': b.confirmRemove = el.getAttribute('data-id'); save(); render(); scrollToId('manage'); break;
      case 'b-remove-no': b.confirmRemove = null; save(); render(); break;
      case 'b-remove-yes': {
        var id = el.getAttribute('data-id');
        b.bundles = b.bundles.filter(function (x) { return x.id !== id; });
        if (b.manage && b.manage.id === id) b.manage = null;
        b.confirmRemove = null; save(); render(); scrollToId('manage'); break;
      }
      case 'b-new':
        b.draftId = null; b.manage = null; gs.started = true; gs.confirmed = {}; gs.skipped = {}; gs.editing = null; save();
        if (location.hash.indexOf('#guide/bundles') === 0) { render(); focusCurrent(); } else location.hash = '#guide/bundles';
        break;
      case 'b-test-buy': {
        var x = bundleById(el.getAttribute('data-id'));
        var out = { tone: 'success', title: x.price.free ? 'Test claim complete' : 'Test purchase complete', msg: 'Delivered: ' + contentsLabel(x) + '.' };
        if (gs.started && !gs.confirmed.check) out.action = { label: 'Confirm in guide', href: '#guide/bundles' };
        document.getElementById('buy-result').innerHTML = notification(out); break;
      }
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'b-ptype') { var f = t.closest('form'); f.querySelector('.b-paid').hidden = t.value === 'free'; }
    if (t.name === 'b-lnoend') { var end = t.closest('form').querySelector('#b-lend'); end.disabled = t.checked; }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target, kind = f.getAttribute('data-form');
    if (!kind || kind.indexOf('b-') !== 0) return;
    e.preventDefault();
    var b = BJ(), gs = PJ().guides.bundles, fd = new FormData(f);
    var target = f.getAttribute('data-bundle') ? bundleById(f.getAttribute('data-bundle')) : draft();
    var inManage = !!(b.manage && target && b.manage.id === target.id && f.closest('#manage'));
    if (kind === 'b-group') {
      b.createdGroups.push(String(fd.get('b-gname')).trim());
      bundleMsg('Group created', 'Add items next, or continue to the next step.');
    } else if (kind === 'b-item') {
      b.createdItems.push({ id: 'c' + (b.seq++), name: String(fd.get('b-iname')).trim(), type: fd.get('b-itype'), price: Number(fd.get('b-iprice')) });
      bundleMsg('Item created', 'It’s in your catalog and ready to add to a bundle.');
    } else if (kind === 'b-describe') {
      var sku = String(fd.get('b-sku')).trim();
      var clash = b.bundles.filter(function (x) { return x.sku === sku && (!target || x.id !== target.id); })[0];
      if (clash) { alertInline(f, 'A bundle with this SKU already exists'); return; }
      if (target) { Object.assign(target, { name: fd.get('b-name'), desc: fd.get('b-desc'), groups: fd.getAll('b-groups') }); }
      else {
        var nb = { id: 'b' + (b.seq++), sku: sku, name: String(fd.get('b-name')), desc: String(fd.get('b-desc') || ''), groups: fd.getAll('b-groups'), contents: [], price: null, limits: null };
        b.bundles.push(nb); b.draftId = nb.id;
      }
      bundleMsg(target ? 'Details saved' : 'Bundle saved', target ? '' : 'Next, choose what’s inside.');
    } else if (kind === 'b-contents') {
      var contents = contentPool().map(function (it) { return { id: it.id, qty: Number(fd.get('qty-' + it.id) || 0) }; }).filter(function (c) { return c.qty > 0; });
      if (!contents.length) { alertInline(f, 'Add at least one item. A bundle can’t be empty.'); return; }
      target.contents = contents;
      bundleMsg('Contents saved', contentsLabel(target));
    } else if (kind === 'b-price') {
      if (fd.get('b-ptype') === 'free') target.price = { free: true };
      else {
        var amounts = {};
        BA().currencies.forEach(function (c) { var v = fd.get('b-amt-' + c.id); if (v !== null && v !== '') amounts[c.id] = Number(v); });
        var def = fd.get('b-def') || 'USD';
        if (amounts[def] == null) { alertInline(f, 'Set a price in the default currency'); return; }
        target.price = { free: false, amounts: amounts, def: def, regional: !!fd.get('b-regional') };
      }
      bundleMsg('Price saved', priceLabel(target));
    } else if (kind === 'b-limits') {
      var noEnd = !!fd.get('b-lnoend');
      var start = fd.get('b-lstart'), end = noEnd ? null : document.getElementById('b-lend').value;
      if (!noEnd && start && end && end < start) { alertInline(f, 'The end date must be after the start date'); return; }
      target.limits = { qty: fd.get('b-lqty') ? Number(fd.get('b-lqty')) : null, start: start, end: end, noEnd: noEnd, tz: fd.get('b-ltz') || 'UTC' };
      bundleMsg('Limits saved', limitsLabel(target));
    }
    if (!inManage) gs.editing = null;
    save();
    var onFallback = parse().path === 'catalog/frame';
    if (onFallback) { location.hash = '#guide/bundles'; return; }
    render();
    if (inManage) scrollToId('manage'); else focusCurrent();
  });
  function scrollToId(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  window.addEventListener('hashchange', function () {
    if (parse().q.section === 'manage') setTimeout(function () { scrollToId('manage'); }, 50);
  });

  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); document.getElementById('view').focus({ preventScroll: true }); });
  render();
})();
  </script>
</body>
</html>
